name: PR validation

# No path exclusions: documentation, workflow, and test-only PRs must also
# produce the required check instead of leaving it permanently pending.
on:
  pull_request:
    branches: [main, staging_crm]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  full-validation:
    # One canonical implementation: build (including bundle budget), API
    # tests, lint + audit, backend/frontend units, and migration safety.
    # No secrets are inherited. validation_only also guards the deploy job.
    uses: ./.github/workflows/deploy.yml
    with:
      validation_only: true

  required-check:
    name: PR validation
    if: ${{ always() }}
    needs: full-validation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful validation
        env:
          RESULT: ${{ needs.full-validation.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::All six CI gates must pass; result=$RESULT"
            exit 1
          fi
