server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API proxy → backend service (named 'backend' in docker-compose network)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads proxy → backend
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Raw WebSocket endpoints served by Express — currently the Callified
    # agent bridge at /ws/callified-agent, which carries live two-way call
    # audio for manual (human) calls. The Upgrade/Connection headers are what
    # turn this from a normal proxy into a WebSocket tunnel; without them the
    # handshake 400s and manual calls never connect.
    #
    # The read timeout must outlive the longest call: nginx's 60s default
    # would cut a quiet caller off mid-conversation.
    location /ws/ {
        proxy_pass http://backend:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Public landing pages are server-rendered HTML from the backend.
    # Must proxy BEFORE the SPA catch-all, otherwise /p/<slug> falls through
    # to React Router and shows a blank / 404 page.
    location /p/ {
        proxy_pass http://backend:3000/p/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /trips renders the currently featured published landing page as
    # server-rendered HTML. Proxy to the backend before the SPA catch-all.
    location /trips {
        proxy_pass http://backend:3000/trips;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — React Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
