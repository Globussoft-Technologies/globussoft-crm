<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="preconnect" href="https://flagcdn.com" crossorigin />

  <title>Web Form</title>

  <style>

    *,*::before,*::after{box-sizing:border-box}

    html,body{margin:0;padding:0;background:radial-gradient(circle at 10% 0%,rgba(99,102,241,.14),transparent 42%),linear-gradient(145deg,#f8f9ff 0%,#eef1ff 100%);color:#10132d;font-family:var(--gbs-font,Inter,system-ui,sans-serif)}

    body{padding:20px}

    .wrap{max-width:620px;margin:0 auto}

    .panel{background:var(--gbs-form,rgba(255,255,255,.94));border:1px solid rgba(148,163,184,.28);border-radius:24px;padding:30px;box-shadow:0 24px 70px rgba(30,41,96,.14);backdrop-filter:blur(12px)}

    .logo{max-height:48px;max-width:210px;object-fit:contain;display:block;margin-bottom:16px}

    .form-header{margin-bottom:24px}


    h1{margin:0 0 10px;color:var(--gbs-title,#10132d);font-size:clamp(1.55rem,4vw,2.15rem);font-weight:800;letter-spacing:-.035em;line-height:1.12}

    p.desc{margin:0;color:var(--gbs-text,#52607a);font-size:.92rem;line-height:1.6}

    .field{margin-bottom:16px}

    .conditional-field{border-left:3px solid rgba(99,102,241,.34);padding-left:12px}

    .phone-input{display:grid;grid-template-columns:96px minmax(0, 1fr);gap:8px}

    .phone-input select{scrollbar-color:#8b8b8b #f1f1f1;scrollbar-width:thin}
    .phone-input select::-webkit-scrollbar{width:8px}
    .phone-input select::-webkit-scrollbar-track{background:#f1f1f1;border-radius:4px}
    .phone-input select::-webkit-scrollbar-thumb{background:#8b8b8b;border-radius:4px;min-height:50%}
    .phone-country-picker{position:relative}
    .phone-country-picker>input{width:100%;padding:.82rem .65rem .82rem 2.45rem;background:#fff;background-repeat:no-repeat;background-position:.7rem center;background-size:20px 14px;color:#111827;border:1px solid #d8ddec;border-radius:12px;font:inherit;font-weight:650;text-align:left;line-height:1.2}
    .phone-country-picker>input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.13)}
    .phone-country-options{position:absolute;z-index:20;display:none;top:calc(100% + 4px);left:0;width:180px;max-height:145px;overflow-y:auto;background:#fff;border:1px solid #9ca3af;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
    .phone-country-picker.open .phone-country-options{display:block}
    .phone-country-options button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;border-radius:0;background:#fff;color:#111827;text-align:left;font:inherit;cursor:pointer}
    .phone-country-flag{display:block;width:20px;height:14px;flex:0 0 20px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(15,23,42,.12)}
    .phone-country-options button:hover,.phone-country-options button.selected{background:#4059d2;color:#fff}

    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}

    .half{grid-column:span 1}

    .full{grid-column:1/-1}

    label{display:block;font-size:.78rem;color:var(--gbs-label,#34405e);font-weight:700;margin-bottom:4px}

    input,select,textarea{width:100%;border:1px solid #d8ddec;border-radius:12px;padding:.82rem .9rem;font:inherit;background:#fff;color:#111827;transition:border-color .2s,box-shadow .2s,transform .2s}

    textarea{min-height:104px;resize:vertical}

    input:focus,select:focus,textarea:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.13);transform:translateY(-1px)}

    .check{display:inline-flex;align-items:flex-start;gap:8px;color:var(--gbs-text,#111827);font-size:.95rem;cursor:pointer;text-align:left;margin-bottom:0;width:fit-content;max-width:100%}

    .check input{flex-shrink:0;width:auto;margin-top:2px}

    .choices{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

    .choices .check span{line-height:1.35}

    .optin a{color:var(--gbs-accent,#12344D);text-decoration:underline}

    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}

    .step-progress{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px;padding-bottom:14px;border-bottom:1px solid #edf0f7}
    .step-progress-item{display:flex;align-items:center;gap:6px;color:#8791a8;font-size:.78rem;font-weight:750}
    .step-progress-item::after{content:'→';margin-left:4px;color:#c3c9d6}.step-progress-item:last-child::after{content:''}
    .step-progress-item.current{color:var(--gbs-button,#12344D)}.step-progress-item.completed{color:#16805c}
    .step-number{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#edf0f7;color:inherit}.current .step-number{background:var(--gbs-button,#12344D);color:#fff}.completed .step-number{background:#d9f5e9}
    .step-description{margin:-12px 0 18px;color:var(--gbs-text,#52607a);font-size:.88rem}

    button{border:0;border-radius:12px;padding:.86rem 1.1rem;font:inherit;font-weight:750;cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s}

    .primary{background:var(--gbs-button,#12344D);color:#fff;min-width:150px;box-shadow:0 10px 22px color-mix(in srgb,var(--gbs-button,#12344D) 25%,transparent)}

    .primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 26px color-mix(in srgb,var(--gbs-button,#12344D) 32%,transparent)}

    button:disabled{cursor:wait;opacity:.72}

    .note{margin-top:22px;padding-top:16px;border-top:1px solid #edf0f7;font-size:.78rem;color:var(--gbs-text,#52607a);opacity:.85}

    .note a{color:inherit;text-decoration:none}

    .note a:hover,.note a:focus-visible{text-decoration:underline}

    .error,.success{border-radius:16px;padding:18px 18px;margin-bottom:18px;line-height:1.55}

    .error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;white-space:pre-line}
    .field-error{display:block;color:#b91c1c;font-size:0.82rem;margin-top:3px;line-height:1.35}

    .success{background:linear-gradient(135deg,#ecfdf5,#f0fdf4);color:#065f46;border:1px solid #a7f3d0;text-align:center;font-weight:700}

    /* Keep the generic CRM confirmation centered in the available page. */
    .generic-success{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center}

    .generic-success .panel{width:100%}

    .success::before{content:'✓';display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin:0 auto 10px;border-radius:50%;background:#10b981;color:#fff;font-size:1.1rem}

    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}

    @keyframes spin{to{transform:rotate(360deg)}}

    @media (max-width:640px){body{padding:12px}.panel{padding:22px 18px;border-radius:20px}.grid{grid-template-columns:1fr}.half,.full{grid-column:1/-1}}

  </style>

</head>

<body>

  <div class="wrap">

    <div id="app"></div>

  </div>

  <script>

    (function(){

      var params = new URLSearchParams(location.search);

      var slug = params.get('id') || params.get('slug') || '';

      var scope = params.get('scope') || 'generic';

      var apiBase = (params.get('api') || location.origin).replace(/\/+$/,'');

      var root = document.getElementById('app');

      var formData = null;

      var busy = false;

      var currentStepIndex = 0;

      var resizeTimer = null;
      var hostContext = {};
      var ipCountryDetectionStarted = false;



      function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }
      function readCookie(name){
        var prefix = name + '=';
        var found = document.cookie.split(';').map(function(v){ return v.trim(); }).filter(function(v){ return v.indexOf(prefix) === 0; })[0];
        return found ? decodeURIComponent(found.substring(prefix.length)) : '';
      }
      function rememberCookie(name, value){
        if (!value || readCookie(name)) return;
        document.cookie = name + '=' + encodeURIComponent(String(value).slice(0, 2000)) + '; Max-Age=7776000; Path=/; SameSite=Lax';
      }
      function normalizeBrowser(ua){ if (/Edg\//i.test(ua)) return 'Edge'; if (/OPR\//i.test(ua)) return 'Opera'; if (/Chrome|CriOS/i.test(ua)) return 'Chrome'; if (/Firefox|FxiOS/i.test(ua)) return 'Firefox'; if (/Safari/i.test(ua)) return 'Safari'; return 'Other'; }
      function normalizeOs(ua){
        var match;
        if ((match = ua.match(/Windows NT ([\d.]+)/i))) { var win = {'10.0':'10/11','6.3':'8.1','6.2':'8','6.1':'7'}[match[1]] || match[1]; return 'Windows ' + win; }
        if ((match = ua.match(/Android ([\d.]+)/i))) return 'Android ' + match[1];
        if ((match = ua.match(/(?:CPU iPhone OS|CPU OS) ([\d_]+)/i))) return 'iOS ' + match[1].replace(/_/g, '.');
        if ((match = ua.match(/Mac OS X ([\d_\.]+)/i))) return 'macOS ' + match[1].replace(/_/g, '.');
        if (/Linux/i.test(ua)) return 'Linux';
        return 'Other';
      }
      var phoneRules = { '+1':[10,10], '+7':[10,10], '+20':[8,10], '+27':[9,9], '+33':[9,9], '+44':[9,10], '+49':[10,11], '+61':[9,9], '+65':[8,8], '+81':[9,10], '+86':[11,11], '+91':[10,10], '+971':[9,9] };
      var phoneCountryIsoByCode = {
        '+1':'US', '+7':'RU', '+20':'EG', '+27':'ZA', '+30':'GR', '+31':'NL', '+32':'BE', '+33':'FR', '+34':'ES', '+36':'HU', '+39':'IT', '+40':'RO', '+41':'CH', '+43':'AT', '+44':'GB', '+45':'DK', '+46':'SE', '+47':'NO', '+48':'PL', '+49':'DE', '+51':'PE', '+52':'MX', '+53':'CU', '+54':'AR', '+55':'BR', '+56':'CL', '+57':'CO', '+58':'VE', '+60':'MY', '+61':'AU', '+62':'ID', '+63':'PH', '+64':'NZ', '+65':'SG', '+66':'TH', '+81':'JP', '+82':'KR', '+84':'VN', '+86':'CN', '+90':'TR', '+91':'IN', '+92':'PK', '+93':'AF', '+94':'LK', '+95':'MM', '+98':'IR',
        '+211':'SS', '+212':'MA', '+213':'DZ', '+216':'TN', '+218':'LY', '+220':'GM', '+221':'SN', '+222':'MR', '+223':'ML', '+224':'GN', '+225':'CI', '+226':'BF', '+227':'NE', '+228':'TG', '+229':'BJ', '+230':'MU', '+231':'LR', '+232':'SL', '+233':'GH', '+234':'NG', '+235':'TD', '+236':'CF', '+237':'CM', '+238':'CV', '+239':'ST', '+240':'GQ', '+241':'GA', '+242':'CG', '+243':'CD', '+244':'AO', '+245':'GW', '+246':'IO', '+248':'SC', '+249':'SD', '+250':'RW', '+251':'ET', '+252':'SO', '+253':'DJ', '+254':'KE', '+255':'TZ', '+256':'UG', '+257':'BI', '+258':'MZ', '+260':'ZM', '+261':'MG', '+262':'RE', '+263':'ZW', '+264':'NA', '+265':'MW', '+266':'LS', '+267':'BW', '+268':'SZ', '+269':'KM',
        '+290':'SH', '+291':'ER', '+297':'AW', '+298':'FO', '+299':'GL', '+350':'GI', '+351':'PT', '+352':'LU', '+353':'IE', '+354':'IS', '+355':'AL', '+356':'MT', '+357':'CY', '+358':'FI', '+359':'BG', '+370':'LT', '+371':'LV', '+372':'EE', '+373':'MD', '+374':'AM', '+375':'BY', '+376':'AD', '+377':'MC', '+378':'SM', '+379':'VA', '+380':'UA', '+381':'RS', '+382':'ME', '+383':'XK', '+385':'HR', '+386':'SI', '+387':'BA', '+389':'MK', '+420':'CZ', '+421':'SK', '+423':'LI',
        '+500':'FK', '+501':'BZ', '+502':'GT', '+503':'SV', '+504':'HN', '+505':'NI', '+506':'CR', '+507':'PA', '+508':'PM', '+509':'HT', '+590':'GP', '+591':'BO', '+592':'GY', '+593':'EC', '+594':'GF', '+595':'PY', '+596':'MQ', '+597':'SR', '+598':'UY', '+599':'CW', '+670':'TL', '+672':'NF', '+673':'BN', '+674':'NR', '+675':'PG', '+676':'TO', '+677':'SB', '+678':'VU', '+679':'FJ', '+680':'PW', '+681':'WF', '+682':'CK', '+683':'NU', '+685':'WS', '+686':'KI', '+687':'NC', '+688':'TV', '+689':'PF', '+690':'TK', '+691':'FM', '+692':'MH',
        '+850':'KP', '+852':'HK', '+853':'MO', '+855':'KH', '+856':'LA', '+880':'BD', '+886':'TW', '+960':'MV', '+961':'LB', '+962':'JO', '+963':'SY', '+964':'IQ', '+965':'KW', '+966':'SA', '+967':'YE', '+968':'OM', '+970':'PS', '+971':'AE', '+972':'IL', '+973':'BH', '+974':'QA', '+975':'BT', '+976':'MN', '+977':'NP', '+992':'TJ', '+993':'TM', '+994':'AZ', '+995':'GE', '+996':'KG', '+998':'UZ'
      };
      var phoneCountryCodeByIso = {};
      Object.keys(phoneCountryIsoByCode).forEach(function(code){ phoneCountryCodeByIso[phoneCountryIsoByCode[code]] = code; });
      phoneCountryCodeByIso.CA = '+1';
      phoneCountryCodeByIso.KZ = '+7';
      function phoneCountryFlag(code){
        var iso = phoneCountryIsoByCode[code];
        if (!iso) return '🌐';
        return iso.split('').map(function(letter){ return String.fromCodePoint(127397 + letter.charCodeAt(0)); }).join('');
      }
      function phoneCountryFlagUrl(code){
        var iso = phoneCountryIsoByCode[code];
        return iso ? 'https://flagcdn.com/w20/' + iso.toLowerCase() + '.png' : '';
      }
      var phoneCountryFlagPreloadCache = {};
      function preloadPhoneCountryFlag(code){
        var flagUrl = phoneCountryFlagUrl(code);
        if (!flagUrl || phoneCountryFlagPreloadCache[flagUrl] || typeof Image === 'undefined') return;
        var image = new Image();
        image.decoding = 'async';
        phoneCountryFlagPreloadCache[flagUrl] = image;
        image.src = flagUrl;
      }
      function detectGenericCountryFromIp(country, input, allowedCountries, restrictedCountries, applyRule, phoneState){
        if (scope !== 'generic' || ipCountryDetectionStarted) return;
        ipCountryDetectionStarted = true;
        var endpoints = [
          { url: 'https://ipapi.co/json/', parse: function(data){ return data && (data.country_code || data.countryCode); } },
          { url: 'https://ipwho.is/', parse: function(data){ return data && (data.country_code || data.countryCode); } },
          { url: 'https://api.country.is/', parse: function(data){ return data && data.country; } },
        ];
        function lookup(endpoint){
          var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var timeoutId = setTimeout(function(){ if (controller) controller.abort(); }, 1800);
          var cacheBuster = (endpoint.url.indexOf('?') === -1 ? '?' : '&') + 'gbs_country=' + Date.now();
          var requestOptions = { headers: { Accept: 'application/json' }, cache: 'no-store', credentials: 'omit' };
          if (controller) requestOptions.signal = controller.signal;
          return fetch(endpoint.url + cacheBuster, requestOptions)
            .then(function(response){
              clearTimeout(timeoutId);
              if (!response.ok) throw new Error('IP country lookup failed');
              return response.json();
            })
            .then(endpoint.parse)
            .then(function(iso){
              if (!iso) throw new Error('IP country was not returned');
              return String(iso).trim().toUpperCase();
            })
            .catch(function(error){
              clearTimeout(timeoutId);
              throw error;
            });
        }
        var lookupResults = endpoints.map(lookup);
        new Promise(function(resolve, reject){
          var pending = lookupResults.length;
          var settled = false;
          lookupResults.forEach(function(result){
            result.then(function(iso){
              if (!settled) { settled = true; resolve(iso); }
            }).catch(function(){
              pending -= 1;
              if (!pending && !settled) reject(new Error('IP country lookup failed'));
            });
          });
        })
          .then(function(iso){
            var detectedCode = phoneCountryCodeByIso[iso];
            if (!detectedCode || !Array.from(country.options).some(function(option){ return option.value === detectedCode; })) return;
            if (restrictedCountries && allowedCountries.indexOf(detectedCode) === -1) return;
            if (String(input.value || '').trim() || phoneState.userEnteredPhone || phoneState.userSelectedCountry) return;
            phoneState.applyingDetectedCountry = true;
            country.value = detectedCode;
            country.dispatchEvent(new Event('change'));
            phoneState.applyingDetectedCountry = false;
            applyRule();
          })
          .catch(function(){ /* IP detection is optional; keep the existing default silently. */ })
          ;
      }
      function setupGenericPhone(){
        if (scope !== 'generic') return;
        var country = document.querySelector('select[name="phoneCountry"]');
        var input = document.querySelector('input[name="phone"]');
        if (!country || !input) return;
        var phoneSettings = formData.settings || {};
        var phoneState = { userEnteredPhone: false, userSelectedCountry: false, applyingDetectedCountry: false };
        var restrictedCountries = phoneSettings.phoneAllowAllCountries === false || String(phoneSettings.phoneAllowAllCountries).toLowerCase() === 'false';
        var allowedCountries = (phoneSettings.phoneAllowedCountries || []).map(function(value){ return String(value).replace(/\D/g, ''); }).filter(Boolean).map(function(value){ return '+' + value; });
        if (restrictedCountries) {
          Array.prototype.forEach.call(country.options, function(option){ option.hidden = allowedCountries.indexOf(option.value) === -1; });
          if (allowedCountries.length) country.value = allowedCountries.indexOf('+91') !== -1 ? '+91' : allowedCountries[0];
        } else if (Array.from(country.options).some(function(option){ return option.value === '+91'; })) {
          country.value = '+91';
        }
        var phoneExamples = { '+1':'2025550123', '+44':'7911123456', '+61':'412345678', '+91':'9876543210', '+971':'501234567', '+81':'9012345678', '+49':'15123456789', '+33':'612345678', '+65':'81234567' };
        function applyRule(){ var rule = phoneRules[country.value] || [7,15]; input.minLength = rule[0]; input.maxLength = rule[1]; input.placeholder = phoneExamples[country.value] || (rule[0] === rule[1] ? rule[0] + ' digits' : rule[0] + '-' + rule[1] + ' digits'); }
        input.setAttribute('inputmode', 'numeric'); input.setAttribute('pattern', '[0-9]*');
        input.addEventListener('input', function(){
          phoneState.userEnteredPhone = true;
          var raw = String(input.value || '').trim();
          if (raw.charAt(0) === '+') {
            var codes = Object.keys(phoneRules).sort(function(a,b){ return b.length - a.length; });
            var matched = codes.find(function(code){ return raw.indexOf(code) === 0; });
            if (matched) { country.value = matched; raw = raw.substring(matched.length); applyRule(); }
          }
          raw = raw.replace(/\D/g, '');
          var selectedRule = phoneRules[country.value] || [7,15];
          var numericCodes = Object.keys(phoneRules).sort(function(a,b){ return b.length - a.length; });
          if (raw.length > selectedRule[1]) {
            var bareCode = numericCodes.find(function(code){ return raw.indexOf(code.substring(1)) === 0 && raw.length - code.substring(1).length >= (phoneRules[code] || [7,15])[0]; });
            if (bareCode) { country.value = bareCode; raw = raw.substring(bareCode.length - 1); applyRule(); }
          }
          input.value = raw;
        });
        country.addEventListener('change', function(){
          if (!phoneState.applyingDetectedCountry) phoneState.userSelectedCountry = true;
          applyRule();
        });
        applyRule();
        detectGenericCountryFromIp(country, input, allowedCountries, restrictedCountries, applyRule, phoneState);
      }
      window.addEventListener('message', function(event){ if(event.data && event.data.source === 'gbs-web-form-host' && event.data.type === 'context'){ hostContext = { pageUrl: String(event.data.pageUrl || ''), pageTitle: String(event.data.pageTitle || '') }; } });

      function getFieldOptions(field){
        var raw = Array.isArray(field && field.options) ? field.options.slice() : [];
        if (!raw.length && field && typeof field.optionsText === 'string') raw = field.optionsText.split(',');
        return raw.map(function(v){ return String(v == null ? '' : v).trim(); }).filter(Boolean);
      }

      function postSize(){ try{ parent.postMessage({ source:'gbs-web-form', type:'size', height: document.body.scrollHeight }, '*'); }catch(e){} }
      try { parent.postMessage({ source:'gbs-web-form', type:'ready' }, '*'); } catch(e) {}

      function scheduleSize(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(postSize, 20); }

      if (typeof ResizeObserver !== 'undefined') { new ResizeObserver(scheduleSize).observe(document.body); }



      function styleVars(style){

        style = style || {};

        return [

          '--gbs-font:' + (style.fontFamily || 'Inter, system-ui, sans-serif'),

          '--gbs-bg:' + (style.backgroundColor || '#EBEFF3'),

          '--gbs-form:' + (style.formColor || '#FFFFFF'),

          '--gbs-title:' + (style.titleColor || '#000000'),

          '--gbs-text:' + (style.textColor || '#111827'),

          '--gbs-label:' + (style.fieldLabelColor || '#666666'),

          '--gbs-button:' + (style.buttonColor || '#12344D'),

          '--gbs-accent:' + (style.accentColor || '#12344D'),

        ].join(';');

      }

      function fieldHtml(field){

        var name = esc(field.sourceKey || field.id || 'field');

        if (field.hidden) {

          var hiddenValue = esc(field.defaultValue || '');

          return '<input type="hidden" name="' + name + '" value="' + hiddenValue + '" />';

        }

        var required = field.required ? 'required' : '';

        var requiredMark = field.required ? ' <span class="required-star" aria-hidden="true">*</span>' : '';

        var widthClass = field.width === 'half' ? 'half' : 'full';

        var label = esc(field.label || 'Field');

        var help = field.helpText ? '<div class="note" style="margin-top:6px">' + esc(field.helpText) + '</div>' : '';

      function setupGenericConditionalFields(fields){
        if (scope !== 'generic') return;

          var values = [];

            if (!control || control.name !== sourceKey) return;
            if (control.disabled) return;
            if ((control.type === 'checkbox' || control.type === 'radio') && !control.checked) return;
            if (control.tagName === 'SELECT' && control.multiple) {
              Array.prototype.forEach.call(control.selectedOptions, function(option){ values.push(String(option.value)); });
            } else if (control.value != null) {

            }

          Array.prototype.forEach.call(wrapper.querySelectorAll('input,select,textarea'), function(control){
            if (control.type === 'checkbox' || control.type === 'radio') {
              control.checked = false;
            } else if (control.tagName === 'SELECT') {

              control.value = '';

          var changed = true;

          while (changed && pass <= fields.length) {

            Array.prototype.forEach.call(conditionalWrappers, function(wrapper){

              var values = conditionField ? readFieldValues(conditionField.sourceKey) : [];

        var condition = field && field.showWhen;

                var searchable = String(node.textContent || '').toLowerCase() + ' ' + String(node.dataset.code || '').toLowerCase();
                var normalizedSearchable = searchable.replace(/\+/g, '');
                var allowed = !pickerRestrictedCountries || pickerAllowedCountries.indexOf(node.dataset.code) !== -1;
                node.style.display = allowed && (!normalizedQuery || normalizedSearchable.indexOf(normalizedQuery) !== -1) ? 'block' : 'none';
              });
              var exact = Array.prototype.find.call(countrySelect.options, function(option) { return option.value.toLowerCase() === query || option.value.replace(/^\+/, '') === numericQuery; });
              if (exact) { countrySelect.value = exact.value; countrySelect.dispatchEvent(new Event('change')); }
            });
            countrySelect.addEventListener('change', updatePickerTrigger);
            picker.appendChild(trigger);
            picker.appendChild(options);
            countrySelect.style.display = 'none';
            countrySelect.parentNode.insertBefore(picker, countrySelect);
          }

          if (genericPhoneInput) {
            // E.164 permits at most 15 digits; one extra character allows a
            // pasted leading "+" before it is normalized to national digits.
            genericPhoneInput.setAttribute('maxlength', '16');
            genericPhoneInput.setAttribute('inputmode', 'numeric');
            genericPhoneInput.addEventListener('input', function() {
              var rawPhoneInput = String(genericPhoneInput.value || '');
              var digits = rawPhoneInput.replace(/\D/g, '');
              var selectedCountryDigits = String(countrySelect && countrySelect.value || '').replace(/\D/g, '');
              if (rawPhoneInput.trim().charAt(0) === '+' && selectedCountryDigits && digits.indexOf(selectedCountryDigits) === 0) {
                digits = digits.slice(selectedCountryDigits.length);
              }
              digits = digits.slice(0, nationalPhoneMaxLength());
              if (genericPhoneInput.value !== digits) genericPhoneInput.value = digits;
            });
          }
        }

        scheduleSize();

        var formEl = document.getElementById('gbs-form');

        if (multiStepConfig().enabled) {
          document.getElementById('step-next').addEventListener('click', function(){ if (validateStep(currentStepIndex)) showStep(currentStepIndex + 1); });
          document.getElementById('step-previous').addEventListener('click', function(){ showStep(currentStepIndex - 1); });
          showStep(0);
        }

        formEl.addEventListener('submit', submitForm);

      }



      function showBusy(flag){

        busy = flag;

        var btn = document.getElementById('submit-btn');

        if (!btn) return;

        btn.disabled = flag;

        btn.innerHTML = flag ? '<span class="spinner"></span>Sending' : esc((formData.settings && formData.settings.submitButtonLabel) || 'Submit');

      }

      function showFieldErrors(errors){
        document.querySelectorAll('.field-error').forEach(function(el){ el.remove(); });
        Object.keys(errors || {}).forEach(function(key){
          var nodes = document.querySelectorAll('[name="' + String(key).replace(/"/g, '\\"') + '"]');
          if (!nodes.length) return;
          var field = nodes[0].closest('.field');
          if (!field) return;
          var message = document.createElement('span');
          message.className = 'field-error';
          message.textContent = String(errors[key] || 'Invalid value');
          field.appendChild(message);
        });
      }



      async function submitForm(event){

        event.preventDefault();

        if (busy) return;

        var stepConfig = multiStepConfig();
        if (stepConfig.enabled) {
          for (var stepIndex = 0; stepIndex < stepConfig.steps.length; stepIndex += 1) {
            if (!validateStep(stepIndex)) { showStep(stepIndex); return; }
          }
        }

        showBusy(true);

        var fd = new FormData(event.target);

        // Generic CRM attribution metadata. These values are informational
        // only; the server remains the source of truth for tenant/form IDs.
        if (scope === 'generic') {
          var pageUrl = hostContext.pageUrl || document.referrer || window.location.href;
          var pageTitle = hostContext.pageTitle || document.title || formData.name || '';
          var pageUrlObject = null;
          try { pageUrlObject = new URL(pageUrl); } catch(e) {}
          var query = pageUrlObject ? pageUrlObject.searchParams : new URLSearchParams(window.location.search);
          var pageSource = query.get('utm_source') || (document.referrer ? (function(){ try { return new URL(document.referrer).hostname; } catch(e) { return ''; } })() : 'direct');
          ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','fbclid','fbc','fbp'].forEach(function(key){ rememberCookie('gbs_' + key, query.get(key) || ''); });
          rememberCookie('gbs_landing_url', pageUrl);
          rememberCookie('gbs_landing_title', pageTitle);
          var tracking = {
            pageUrl: pageUrl,
            pageTitle: pageTitle,
            pageSource: pageSource,
            referrerUrl: document.referrer || '',
            landingPageUrl: readCookie('gbs_landing_url') || pageUrl,
            currentDomain: pageUrlObject ? pageUrlObject.hostname : window.location.hostname,
            formName: formData.name || '',
            formId: formData.id || slug,
            utm_source: readCookie('gbs_utm_source'),
            utm_medium: readCookie('gbs_utm_medium'),
            utm_campaign: readCookie('gbs_utm_campaign'),
            utm_term: readCookie('gbs_utm_term'),
            utm_content: readCookie('gbs_utm_content'),
            gclid: readCookie('gbs_gclid'),
            fbclid: readCookie('gbs_fbclid'),
            fbc: readCookie('gbs_fbc'),
            fbp: readCookie('gbs_fbp'),
            submittedAt: new Date().toISOString(),
            browser: normalizeBrowser(navigator.userAgent),
            operatingSystem: normalizeOs(navigator.userAgent),
            deviceType: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'mobile' : 'desktop'
          };
          // Internal transport header: this is not a form field and is never
          // exposed in the form builder or rendered in the visitor form.
          event._gbsTrackingMetadata = tracking;
        }

        if (scope === 'generic' && fd.get('phone')) {
            var phoneInput = String(fd.get('phone')).trim();
            var nationalDigits = phoneInput.replace(/\D/g, '');
            var countryCode = String(fd.get('phoneCountry') || '+91').trim();
            var phoneRule = phoneRules[countryCode] || [7, 15];
            if (nationalDigits.length < phoneRule[0] || nationalDigits.length > phoneRule[phoneRule.length - 1]) {
              showBusy(false);
              showFieldErrors({ phone: 'Enter a valid phone number with ' + (phoneRule[0] === phoneRule[phoneRule.length - 1] ? phoneRule[0] : phoneRule[0] + '-' + phoneRule[phoneRule.length - 1]) + ' digits.' });
              return;
            }
            var internationalPhone = countryCode + nationalDigits;
            if (!/^\+[1-9]\d{7,14}$/.test(internationalPhone)) {
              showBusy(false);
              showFieldErrors({ phone: 'Enter a valid international phone number.' });
              return;
            }
            fd.set('phone', internationalPhone);
          }

        try {

          var requestHeaders = {};
          if (event._gbsTrackingMetadata) {
            requestHeaders['X-GBS-Tracking'] = JSON.stringify(event._gbsTrackingMetadata);
          }
          var res = await fetch(apiBase + '/api/forms/public/' + encodeURIComponent(slug) + '/submit?scope=' + encodeURIComponent(scope), { method: 'POST', body: fd, headers: requestHeaders });

          var json = await res.json().catch(function(){ return {}; });

          if (!res.ok) {
            var submitError = new Error(json.error || 'Submit failed');
            submitError.fieldErrors = json.fields || {};
            throw submitError;
          }

          if (json.redirectUrl || (formData.settings && formData.settings.afterSubmitAction === 'redirect' && formData.settings.redirectUrl)) {

            window.location.href = json.redirectUrl || formData.settings.redirectUrl;

            return;

          }

          setMessage('success', (json.message || (formData.settings && formData.settings.successMessage) || 'Thank you.'));

          if (json.message) scheduleSize();

        } catch (err) {

          showFieldErrors(err.fieldErrors || {});
          var msg = document.getElementById('msg');
          if (msg) msg.innerHTML = Object.keys(err.fieldErrors || {}).length ? '' : '<div class="error">' + esc(err.message || 'Something went wrong') + '</div>';

          scheduleSize();

        } finally {

          showBusy(false);

        }

      }



      async function load(){

        var previewData = '';

        if (location.hash && location.hash.indexOf('preview=') === 1) {

          previewData = decodeURIComponent(location.hash.substring(9));

        }

        if (previewData) {

          try {

            renderForm(JSON.parse(previewData));

            return;

          } catch (err) {

            setMessage('error', err.message || 'Invalid preview data');

            return;

          }

        }

        if (!slug) {

          setMessage('error', 'Missing form reference.');

          return;

        }

        try {

          var res = await fetch(apiBase + '/api/forms/public/' + encodeURIComponent(slug) + '?scope=' + encodeURIComponent(scope));

          var json = await res.json();

          if (!res.ok) throw new Error(json.error || 'Form not found');

          renderForm(json);

        } catch (err) {

          setMessage('error', err.message || 'Unable to load form');

        }

      }



      load();

    })();

  </script>
