<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Web Form</title>

  <style>

    *,*::before,*::after{box-sizing:border-box}

    html,body{margin:0;padding:0;background:radial-gradient(circle at 10% 0%,rgba(99,102,241,.14),transparent 42%),linear-gradient(145deg,#f8f9ff 0%,#eef1ff 100%);color:#10132d;font-family:var(--gbs-font,Inter,system-ui,sans-serif)}

    body{padding:20px}

    .wrap{max-width:620px;margin:0 auto}

    .panel{background:var(--gbs-form,rgba(255,255,255,.94));border:1px solid rgba(148,163,184,.28);border-radius:24px;padding:30px;box-shadow:0 24px 70px rgba(30,41,96,.14);backdrop-filter:blur(12px)}

    .logo{max-height:48px;max-width:210px;object-fit:contain;display:block;margin-bottom:16px}

    .form-header{margin-bottom:24px}


    h1{margin:0 0 10px;color:var(--gbs-title,#10132d);font-size:clamp(1.55rem,4vw,2.15rem);font-weight:800;letter-spacing:-.035em;line-height:1.12}

    p.desc{margin:0;color:var(--gbs-text,#52607a);font-size:.92rem;line-height:1.6}

    .field{margin-bottom:16px}

    .phone-input{display:grid;grid-template-columns:96px minmax(0, 1fr);gap:8px}

    .phone-input select{scrollbar-color:#8b8b8b #f1f1f1;scrollbar-width:thin}
    .phone-input select::-webkit-scrollbar{width:8px}
    .phone-input select::-webkit-scrollbar-track{background:#f1f1f1;border-radius:4px}
    .phone-input select::-webkit-scrollbar-thumb{background:#8b8b8b;border-radius:4px;min-height:50%}
    .phone-country-picker{position:relative}
    .phone-country-picker>input{width:100%;padding:.82rem .9rem;background:#fff;color:#111827;border:1px solid #d8ddec;border-radius:12px;font:inherit;text-align:left;line-height:1.2}
    .phone-country-picker>input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.13)}
    .phone-country-options{position:absolute;z-index:20;display:none;top:calc(100% + 4px);left:0;width:180px;max-height:145px;overflow-y:auto;background:#fff;border:1px solid #9ca3af;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
    .phone-country-picker.open .phone-country-options{display:block}
    .phone-country-options button{display:block;width:100%;padding:7px 10px;border:0;border-radius:0;background:#fff;color:#111827;text-align:left;font:inherit;cursor:pointer}
    .phone-country-options button:hover,.phone-country-options button.selected{background:#4059d2;color:#fff}

    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}

    .half{grid-column:span 1}

    .full{grid-column:1/-1}

    label{display:block;font-size:.78rem;color:var(--gbs-label,#34405e);font-weight:700;margin-bottom:4px}

    input,select,textarea{width:100%;border:1px solid #d8ddec;border-radius:12px;padding:.82rem .9rem;font:inherit;background:#fff;color:#111827;transition:border-color .2s,box-shadow .2s,transform .2s}

    textarea{min-height:104px;resize:vertical}

    input:focus,select:focus,textarea:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.13);transform:translateY(-1px)}

    .check{display:inline-flex;align-items:flex-start;gap:8px;color:var(--gbs-text,#111827);font-size:.95rem;cursor:pointer;text-align:left;margin-bottom:0;width:fit-content;max-width:100%}

    .check input{flex-shrink:0;width:auto;margin-top:2px}

    .choices{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

    .choices .check span{line-height:1.35}

    .optin a{color:var(--gbs-accent,#12344D);text-decoration:underline}

    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}

    button{border:0;border-radius:12px;padding:.86rem 1.1rem;font:inherit;font-weight:750;cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s}

    .primary{background:var(--gbs-button,#12344D);color:#fff;min-width:150px;box-shadow:0 10px 22px color-mix(in srgb,var(--gbs-button,#12344D) 25%,transparent)}

    .primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 26px color-mix(in srgb,var(--gbs-button,#12344D) 32%,transparent)}

    button:disabled{cursor:wait;opacity:.72}

    .note{margin-top:22px;padding-top:16px;border-top:1px solid #edf0f7;font-size:.78rem;color:var(--gbs-text,#52607a);opacity:.85}

    .note a{color:inherit;text-decoration:none}

    .note a:hover,.note a:focus-visible{text-decoration:underline}

    .error,.success{border-radius:16px;padding:18px 18px;margin-bottom:18px;line-height:1.55}

    .error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;white-space:pre-line}
    .field-error{display:block;color:#b91c1c;font-size:0.82rem;margin-top:3px;line-height:1.35}

    .success{background:linear-gradient(135deg,#ecfdf5,#f0fdf4);color:#065f46;border:1px solid #a7f3d0;text-align:center;font-weight:700}

    /* Keep the generic CRM confirmation centered in the available page. */
    .generic-success{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center}

    .generic-success .panel{width:100%}

    .success::before{content:'✓';display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin:0 auto 10px;border-radius:50%;background:#10b981;color:#fff;font-size:1.1rem}

    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}

    @keyframes spin{to{transform:rotate(360deg)}}

    @media (max-width:640px){body{padding:12px}.panel{padding:22px 18px;border-radius:20px}.grid{grid-template-columns:1fr}.half,.full{grid-column:1/-1}}

  </style>

</head>

<body>

  <div class="wrap">

    <div id="app"></div>

  <script>

    (function(){

      var params = new URLSearchParams(location.search);

      var slug = params.get('id') || params.get('slug') || '';

      var scope = params.get('scope') || 'generic';

      var apiBase = (params.get('api') || location.origin).replace(/\/+$/,'');

      var root = document.getElementById('app');

      var formData = null;

      var busy = false;

      var resizeTimer = null;



      function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }

      function getFieldOptions(field){
        var raw = Array.isArray(field && field.options) ? field.options.slice() : [];
        if (!raw.length && field && typeof field.optionsText === 'string') raw = field.optionsText.split(',');
        return raw.map(function(v){ return String(v == null ? '' : v).trim(); }).filter(Boolean);
      }

      function postSize(){ try{ parent.postMessage({ source:'gbs-web-form', type:'size', height: document.body.scrollHeight }, '*'); }catch(e){} }

      function scheduleSize(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(postSize, 20); }

      if (typeof ResizeObserver !== 'undefined') { new ResizeObserver(scheduleSize).observe(document.body); }



      function styleVars(style){

        style = style || {};

        return [

          '--gbs-font:' + (style.fontFamily || 'Inter, system-ui, sans-serif'),

          '--gbs-bg:' + (style.backgroundColor || '#EBEFF3'),

          '--gbs-form:' + (style.formColor || '#FFFFFF'),

          '--gbs-title:' + (style.titleColor || '#000000'),

          '--gbs-text:' + (style.textColor || '#111827'),

          '--gbs-label:' + (style.fieldLabelColor || '#666666'),

          '--gbs-accent:' + (style.accentColor || '#12344D'),

      }

      function fieldHtml(field){

        var name = esc(field.sourceKey || field.id || 'field');

        var label = esc(field.label || 'Field');

        var help = field.helpText ? '<div class="note" style="margin-top:6px">' + esc(field.helpText) + '</div>' : '';

        if (scope === 'generic' && field.sourceKey === 'phone') {
          return '<div class="field ' + widthClass + '"><label for="f-' + name + '">' + label + requiredMark + '</label><div class="phone-input"><select name="phoneCountry" aria-label="Phone country code"><option value="+1">+1</option><option value="+7">+7</option><option value="+20">+20</option><option value="+27">+27</option><option value="+30">+30</option><option value="+31">+31</option><option value="+32">+32</option><option value="+33">+33</option><option value="+34">+34</option><option value="+36">+36</option><option value="+39">+39</option><option value="+40">+40</option><option value="+41">+41</option><option value="+43">+43</option><option value="+44">+44</option><option value="+45">+45</option><option value="+46">+46</option><option value="+47">+47</option><option value="+48">+48</option><option value="+49">+49</option><option value="+51">+51</option><option value="+52">+52</option><option value="+53">+53</option><option value="+54">+54</option><option value="+55">+55</option><option value="+56">+56</option><option value="+57">+57</option><option value="+58">+58</option><option value="+60">+60</option><option value="+61">+61</option><option value="+62">+62</option><option value="+63">+63</option><option value="+64">+64</option><option value="+65">+65</option><option value="+66">+66</option><option value="+81">+81</option><option value="+82">+82</option><option value="+84">+84</option><option value="+86">+86</option><option value="+90">+90</option><option value="+91" selected>+91</option><option value="+92">+92</option><option value="+93">+93</option><option value="+94">+94</option><option value="+95">+95</option><option value="+98">+98</option><option value="+211">+211</option><option value="+212">+212</option><option value="+213">+213</option><option value="+216">+216</option><option value="+218">+218</option><option value="+220">+220</option><option value="+221">+221</option><option value="+222">+222</option><option value="+223">+223</option><option value="+224">+224</option><option value="+225">+225</option><option value="+226">+226</option><option value="+227">+227</option><option value="+228">+228</option><option value="+229">+229</option><option value="+230">+230</option><option value="+231">+231</option><option value="+232">+232</option><option value="+233">+233</option><option value="+234">+234</option><option value="+235">+235</option><option value="+236">+236</option><option value="+237">+237</option><option value="+238">+238</option><option value="+239">+239</option><option value="+240">+240</option><option value="+241">+241</option><option value="+242">+242</option><option value="+243">+243</option><option value="+244">+244</option><option value="+245">+245</option><option value="+246">+246</option><option value="+248">+248</option><option value="+249">+249</option><option value="+250">+250</option><option value="+251">+251</option><option value="+252">+252</option><option value="+253">+253</option><option value="+254">+254</option><option value="+255">+255</option><option value="+256">+256</option><option value="+257">+257</option><option value="+258">+258</option><option value="+260">+260</option><option value="+261">+261</option><option value="+262">+262</option><option value="+263">+263</option><option value="+264">+264</option><option value="+265">+265</option><option value="+266">+266</option><option value="+267">+267</option><option value="+268">+268</option><option value="+269">+269</option><option value="+290">+290</option><option value="+291">+291</option><option value="+297">+297</option><option value="+298">+298</option><option value="+299">+299</option><option value="+350">+350</option><option value="+351">+351</option><option value="+352">+352</option><option value="+353">+353</option><option value="+354">+354</option><option value="+355">+355</option><option value="+356">+356</option><option value="+357">+357</option><option value="+358">+358</option><option value="+359">+359</option><option value="+370">+370</option><option value="+371">+371</option><option value="+372">+372</option><option value="+373">+373</option><option value="+374">+374</option><option value="+375">+375</option><option value="+376">+376</option><option value="+377">+377</option><option value="+378">+378</option><option value="+379">+379</option><option value="+380">+380</option><option value="+381">+381</option><option value="+382">+382</option><option value="+383">+383</option><option value="+385">+385</option><option value="+386">+386</option><option value="+387">+387</option><option value="+389">+389</option><option value="+420">+420</option><option value="+421">+421</option><option value="+423">+423</option><option value="+500">+500</option><option value="+501">+501</option><option value="+502">+502</option><option value="+503">+503</option><option value="+504">+504</option><option value="+505">+505</option><option value="+506">+506</option><option value="+507">+507</option><option value="+508">+508</option><option value="+509">+509</option><option value="+590">+590</option><option value="+591">+591</option><option value="+592">+592</option><option value="+593">+593</option><option value="+594">+594</option><option value="+595">+595</option><option value="+596">+596</option><option value="+597">+597</option><option value="+598">+598</option><option value="+599">+599</option><option value="+670">+670</option><option value="+672">+672</option><option value="+673">+673</option><option value="+674">+674</option><option value="+675">+675</option><option value="+676">+676</option><option value="+677">+677</option><option value="+678">+678</option><option value="+679">+679</option><option value="+680">+680</option><option value="+681">+681</option><option value="+682">+682</option><option value="+683">+683</option><option value="+685">+685</option><option value="+686">+686</option><option value="+687">+687</option><option value="+688">+688</option><option value="+689">+689</option><option value="+690">+690</option><option value="+691">+691</option><option value="+692">+692</option><option value="+850">+850</option><option value="+852">+852</option><option value="+853">+853</option><option value="+855">+855</option><option value="+856">+856</option><option value="+880">+880</option><option value="+886">+886</option><option value="+960">+960</option><option value="+961">+961</option><option value="+962">+962</option><option value="+963">+963</option><option value="+964">+964</option><option value="+965">+965</option><option value="+966">+966</option><option value="+967">+967</option><option value="+968">+968</option><option value="+970">+970</option><option value="+971">+971</option><option value="+972">+972</option><option value="+973">+973</option><option value="+974">+974</option><option value="+975">+975</option><option value="+976">+976</option><option value="+977">+977</option><option value="+992">+992</option><option value="+993">+993</option><option value="+994">+994</option><option value="+995">+995</option><option value="+996">+996</option><option value="+998">+998</option></select><input id="f-' + name + '" type="tel" name="' + name + '" ' + required + ' placeholder="' + placeholder.replace(/^\+\d+\s*/, '') + '" autocomplete="tel-national" /></div>' + help + '</div>';
        }

        if (field.fieldType === 'textarea') return '<div class="field ' + widthClass + '"><label for="f-' + name + '">' + label + requiredMark + '</label><textarea id="f-' + name + '" name="' + name + '" ' + required + ' placeholder="' + placeholder + '"></textarea>' + help + '</div>';

        if (field.fieldType === 'number') return '<div class="field ' + widthClass + '"><label for="f-' + name + '">' + label + requiredMark + '</label><input id="f-' + name + '" type="number" name="' + name + '" ' + required + ' placeholder="' + placeholder + '" />' + help + '</div>';

        if (field.fieldType === 'date') return '<div class="field ' + widthClass + '"><label for="f-' + name + '">' + label + requiredMark + '</label><input id="f-' + name + '" type="date" name="' + name + '" ' + required + ' />' + help + '</div>';

        if (field.fieldType === 'url') return '<div class="field ' + widthClass + '"><label for="f-' + name + '">' + label + requiredMark + '</label><input id="f-' + name + '" type="url" name="' + name + '" ' + required + ' placeholder="' + placeholder + '" />' + help + '</div>';

        if (field.fieldType === 'checkbox') return '<div class="field ' + widthClass + '"><label class="check"><input type="checkbox" name="' + name + '" value="true" ' + required + ' /><span>' + label + requiredMark + '</span></label>' + help + '</div>';

        if (field.fieldType === 'dropdown') {

          var opts = getFieldOptions(field);

          return '<div class="field ' + widthClass + '"><label for="f-' + name + '">' + label + requiredMark + '</label><select id="f-' + name + '" name="' + name + '" ' + required + '><option value="">Select one</option>' + opts.map(function(o){ return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') + '</select>' + help + '</div>';

        }

        if (field.fieldType === 'radio') {

          var ropts = getFieldOptions(field);

          return '<div class="field ' + widthClass + '"><label>' + label + requiredMark + '</label><div class="choices">' + ropts.map(function(o, i){ var id = 'r-' + name + '-' + i; return '<label class="check" for="' + id + '"><input id="' + id + '" type="radio" name="' + name + '" value="' + esc(o) + '" ' + required + ' /><span>' + esc(o) + '</span></label>'; }).join('') + '</div>' + help + '</div>';

        }

        if (field.fieldType === 'multiselect') {

          var mopts = getFieldOptions(field);

          return '<div class="field ' + widthClass + '"><label>' + label + requiredMark + '</label><div class="choices">' + mopts.map(function(o, i){ var id = 'm-' + name + '-' + i; return '<label class="check" for="' + id + '"><input id="' + id + '" type="checkbox" name="' + name + '" value="' + esc(o) + '" /><span>' + esc(o) + '</span></label>'; }).join('') + '</div>' + help + '</div>';

        }

        if (field.fieldType === 'file') return '<div class="field ' + widthClass + '"><label for="f-' + name + '">' + label + requiredMark + '</label><input id="f-' + name + '" type="file" name="' + name + '" ' + required + ' />' + help + '</div>';

        return '<div class="field ' + widthClass + '"><label for="f-' + name + '">' + label + requiredMark + '</label><input id="f-' + name + '" type="text" name="' + name + '" ' + required + ' placeholder="' + placeholder + '" />' + help + '</div>';

      function setMessage(kind, text){

        var message = String(text == null ? '' : text).trim() || 'Thank you! Your information has been received. We will be in touch shortly.';

        var successClass = kind === 'success' && scope === 'generic' ? 'generic-success' : '';

        root.className = successClass;

        root.innerHTML = '<div class="panel"><div class="' + kind + '">' + esc(message) + '</div></div>';

        scheduleSize();

      }



      function renderForm(data){

        formData = data || {};

        var style = formData.style || {};

        document.body.style.background = style.backgroundColor || '#EBEFF3';

        document.documentElement.style.cssText = styleVars(style);

        var fields = Array.isArray(formData.fields) ? formData.fields : [];

        var titleOverride = new URLSearchParams(window.location.search).get('title');
        var rawTitle = String(titleOverride || (formData.settings && formData.settings.formTitle) || '').trim();
        var title = esc(rawTitle);
        var titleHtml = title ? '<h1>' + title + '</h1>' : '';

        var desc = esc(formData.description || '');

        var button = esc((formData.settings && formData.settings.submitButtonLabel) || 'Submit');

        var logo = style.logoUrl ? '<img class="logo" src="' + esc(style.logoUrl) + '" alt="Logo" />' : '';

        var optIn = '';

        if (formData.settings && formData.settings.optInEnabled) {
          var rawConsent = formData.settings.optInText || 'I agree to receive communication on newsletters, promotional content, offers and events.';
          var markdownLink = rawConsent.match(/\[([^\]]+)\]\(([^)]+)\)\s*$/);
          var linkText = formData.settings.optInLinkText || (markdownLink ? markdownLink[1] : '');
          var linkUrl = formData.settings.optInLinkUrl || (markdownLink ? markdownLink[2] : '');
          var baseConsent = markdownLink ? rawConsent.replace(/\s*\[[^\]]+\]\([^)]+\)\s*$/, '') : rawConsent;
          var consentText = esc(baseConsent);
          var linkHtml = linkText && linkUrl ? ' <a href="' + esc(linkUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(linkText) + '</a>' : '';
          optIn = '<div class="field full optin"><label class="check"><input type="checkbox" name="optInConsent" value="true" /><span>' + consentText + linkHtml + '</span></label></div>';
        }

        var footerLink = formData.settings && formData.settings.showPoweredBy === false
          ? ''
          : '<a href="/" target="_top" rel="noopener noreferrer" aria-label="Go to GlobusCRM home page">Powered By GlobusCRM</a>';

        root.innerHTML = '<div class="panel">' + logo + '<div class="form-header">' + titleHtml + (desc ? '<p class="desc">' + desc + '</p>' : '') + '</div><div id="msg"></div><form id="gbs-form"><div class="grid">' + fields.map(fieldHtml).join('') + '</div>' + optIn + '<div class="actions"><button class="primary" id="submit-btn" type="submit">' + button + '</button></div></form>' + (footerLink ? '<div class="note">' + footerLink + '</div>' : '') + '</div>';

        if (scope === 'generic') {
          var countrySelect = root.querySelector('select[name="phoneCountry"]');
          var genericPhoneInput = root.querySelector('input[type="tel"][name]');
          function nationalPhoneMaxLength() {
            var countryDigits = String(countrySelect && countrySelect.value || '').replace(/\D/g, '');
            return Math.max(1, 15 - countryDigits.length);
          }
          if (countrySelect) {
            var picker = document.createElement('div');
            picker.className = 'phone-country-picker';
            var trigger = document.createElement('input');
            trigger.type = 'text';
            trigger.value = countrySelect.options[countrySelect.selectedIndex].text;
            trigger.placeholder = '+91';
            trigger.setAttribute('aria-label', 'Phone country code');
            var options = document.createElement('div');
            options.className = 'phone-country-options';
            Array.prototype.forEach.call(countrySelect.options, function(option) {
              var item = document.createElement('button');
              item.type = 'button';
              item.textContent = option.text;
              item.className = option.value === countrySelect.value ? 'selected' : '';
              item.addEventListener('click', function() {
                countrySelect.value = option.value;
                trigger.textContent = option.text;
                trigger.value = option.text;
                picker.classList.remove('open');
                options.querySelectorAll('button').forEach(function(node) { node.classList.remove('selected'); });
                item.classList.add('selected');
              });
              item.dataset.code = option.value;
              options.appendChild(item);
            });
            trigger.addEventListener('focus', function() { picker.classList.add('open'); });
            trigger.addEventListener('input', function() {
              var query = trigger.value.trim().toLowerCase();
              var numericQuery = query.replace(/^\+/, '');
              picker.classList.add('open');
              options.querySelectorAll('button').forEach(function(node) {
                var codeDigits = node.dataset.code.replace(/^\+/, '');
                node.style.display = !numericQuery || codeDigits.indexOf(numericQuery) === 0 ? 'block' : 'none';
              });
              var exact = Array.prototype.find.call(countrySelect.options, function(option) {
                return option.value.replace(/^\+/, '') === numericQuery;
              });
              if (exact) {
                countrySelect.value = exact.value;
                trigger.value = exact.text;
              }
            });
            picker.appendChild(trigger);
            picker.appendChild(options);
            countrySelect.style.display = 'none';
            countrySelect.parentNode.insertBefore(picker, countrySelect);
          }

          if (genericPhoneInput) {
            // E.164 permits at most 15 digits; one extra character allows a
            // pasted leading "+" before it is normalized to national digits.
            genericPhoneInput.setAttribute('maxlength', '16');
            genericPhoneInput.setAttribute('inputmode', 'numeric');
            genericPhoneInput.addEventListener('input', function() {
              var rawPhoneInput = String(genericPhoneInput.value || '');
              var digits = rawPhoneInput.replace(/\D/g, '');
              var selectedCountryDigits = String(countrySelect && countrySelect.value || '').replace(/\D/g, '');
              if (rawPhoneInput.trim().charAt(0) === '+' && selectedCountryDigits && digits.indexOf(selectedCountryDigits) === 0) {
                digits = digits.slice(selectedCountryDigits.length);
              }
              digits = digits.slice(0, nationalPhoneMaxLength());
              if (genericPhoneInput.value !== digits) genericPhoneInput.value = digits;
            });
          }
        }

        scheduleSize();

        var formEl = document.getElementById('gbs-form');

        formEl.addEventListener('submit', submitForm);

      }



      function showBusy(flag){

        busy = flag;

        var btn = document.getElementById('submit-btn');

        if (!btn) return;

        btn.disabled = flag;

        btn.innerHTML = flag ? '<span class="spinner"></span>Sending' : esc((formData.settings && formData.settings.submitButtonLabel) || 'Submit');

      }

      function showFieldErrors(errors){
        document.querySelectorAll('.field-error').forEach(function(el){ el.remove(); });
        Object.keys(errors || {}).forEach(function(key){
          var nodes = document.querySelectorAll('[name="' + String(key).replace(/"/g, '\\"') + '"]');
          if (!nodes.length) return;
          var field = nodes[0].closest('.field');
          if (!field) return;
          var message = document.createElement('span');
          message.className = 'field-error';
          message.textContent = String(errors[key] || 'Invalid value');
          field.appendChild(message);
        });
      }



      async function submitForm(event){

        event.preventDefault();

        if (busy) return;

        showBusy(true);

        var fd = new FormData(event.target);

          if (scope === 'generic' && fd.get('phone')) {
            var phoneInput = String(fd.get('phone')).trim();
            var nationalDigits = phoneInput.replace(/\D/g, '');
            var countryCode = String(fd.get('phoneCountry') || '+91').trim();
            var internationalPhone = countryCode + nationalDigits;
            if (!/^\+[1-9]\d{7,14}$/.test(internationalPhone)) {
              showBusy(false);
              showFieldErrors({ phone: 'Enter a valid international phone number.' });
              return;
            }
            fd.set('phone', internationalPhone);
          }

        try {

          var res = await fetch(apiBase + '/api/forms/public/' + encodeURIComponent(slug) + '/submit?scope=' + encodeURIComponent(scope), { method: 'POST', body: fd });

          var json = await res.json().catch(function(){ return {}; });

          if (!res.ok) {
            var submitError = new Error(json.error || 'Submit failed');
            submitError.fieldErrors = json.fields || {};
            throw submitError;
          }

          if (json.redirectUrl || (formData.settings && formData.settings.afterSubmitAction === 'redirect' && formData.settings.redirectUrl)) {

            window.location.href = json.redirectUrl || formData.settings.redirectUrl;

            return;

          }

          setMessage('success', (json.message || (formData.settings && formData.settings.successMessage) || 'Thank you.'));

          if (json.message) scheduleSize();

        } catch (err) {

          showFieldErrors(err.fieldErrors || {});
          var msg = document.getElementById('msg');
          if (msg) msg.innerHTML = Object.keys(err.fieldErrors || {}).length ? '' : '<div class="error">' + esc(err.message || 'Something went wrong') + '</div>';

          scheduleSize();

        } finally {

          showBusy(false);

        }

      }



      async function load(){

        var previewData = '';

        if (location.hash && location.hash.indexOf('preview=') === 1) {

          previewData = decodeURIComponent(location.hash.substring(9));

        }

        if (previewData) {

          try {

            renderForm(JSON.parse(previewData));

            return;

          } catch (err) {

            setMessage('error', err.message || 'Invalid preview data');

            return;

          }

        }

        if (!slug) {

          setMessage('error', 'Missing form reference.');

          return;

        }

        try {

          var res = await fetch(apiBase + '/api/forms/public/' + encodeURIComponent(slug) + '?scope=' + encodeURIComponent(scope));

          var json = await res.json();

          if (!res.ok) throw new Error(json.error || 'Form not found');

          renderForm(json);

        } catch (err) {

          setMessage('error', err.message || 'Unable to load form');

        }

      }



      load();

    })();

  </script>

</body>

</html>
