    button{border:0;border-radius:12px;padding:.86rem 1.1rem;font:inherit;font-weight:750;cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s}

    .primary{background:var(--gbs-button,#12344D);color:var(--gbs-button-text,#fff);font-family:var(--gbs-button-font,var(--gbs-font));font-size:var(--gbs-button-size,16px);font-weight:var(--gbs-button-weight,750);font-style:var(--gbs-button-style,normal);text-decoration:var(--gbs-button-decoration,none);text-align:var(--gbs-button-align-text,left);height:var(--gbs-button-height,46px);width:var(--gbs-button-width,auto);border:var(--gbs-button-border-width,0px) solid var(--gbs-button-border,transparent);border-radius:var(--gbs-button-radius,12px);min-width:150px;box-shadow:0 10px 22px color-mix(in srgb,var(--gbs-button,#12344D) 25%,transparent)}

    .primary:hover:not(:disabled){background:var(--gbs-button-hover,var(--gbs-button,#12344D));transform:translateY(-1px);box-shadow:0 14px 26px color-mix(in srgb,var(--gbs-button-hover,var(--gbs-button,#12344D)) 32%,transparent)}

    .field-error{display:block;color:var(--gbs-error-color,#b91c1c);font-family:var(--gbs-error-font,var(--gbs-font));font-size:var(--gbs-error-size,13px);font-weight:var(--gbs-error-weight,400);font-style:var(--gbs-error-style,normal);text-decoration:var(--gbs-error-decoration,none);text-align:var(--gbs-error-align,left);margin-top:3px;line-height:1.35}

    .generic-success{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center}

    .generic-success .panel{width:100%}

    .success::before{content:'✓';display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin:0 auto 10px;border-radius:50%;background:#10b981;color:#fff;font-size:1.1rem}

    @keyframes spin{to{transform:rotate(360deg)}}

    @media (min-width:641px) and (max-width:900px){.grid{grid-template-columns:var(--gbs-tablet-columns,1fr)}}
    @media (max-width:640px){body{padding:12px}.panel{padding:22px 18px;border-radius:20px}.grid{grid-template-columns:var(--gbs-mobile-columns,1fr)}.half,.full{grid-column:auto}.phone-input{grid-template-columns:minmax(0,1fr)}.phone-country-options{width:min(180px,100%)}}

    html.generic-preview-tablet.generic-scope .grid,html.generic-preview-tablet.travel-scope .grid{grid-template-columns:var(--gbs-tablet-columns)}
    html.generic-preview-mobile.generic-scope .grid,html.generic-preview-mobile.travel-scope .grid{grid-template-columns:var(--gbs-mobile-columns)}

  </style>

  <script>

    (function(){

      function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g,function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }
      function readCookie(name){
        var prefix = name + '=';
        var found = document.cookie.split(';').map(function(v){ return v.trim(); }).filter(function(v){ return v.indexOf(prefix) === 0; })[0];
        return found ? decodeURIComponent(found.substring(prefix.length)) : '';
      }
      function rememberCookie(name, value){
        if (!value || readCookie(name)) return;
        document.cookie = name + '=' + encodeURIComponent(String(value).slice(0, 2000)) + '; Max-Age=7776000; Path=/; SameSite=Lax';
      }
      function normalizeBrowser(ua){ if (/Edg\//i.test(ua)) return 'Edge'; if (/OPR\//i.test(ua)) return 'Opera'; if (/Chrome|CriOS/i.test(ua)) return 'Chrome'; if (/Firefox|FxiOS/i.test(ua)) return 'Firefox'; if (/Safari/i.test(ua)) return 'Safari'; return 'Other'; }

        if ((match = ua.match(/(?:CPU iPhone OS|CPU OS) ([\d_]+)/i))) return 'iOS ' + match[1].replace(/_/g, '.');
        if ((match = ua.match(/Mac OS X ([\d_\.]+)/i))) return 'macOS ' + match[1].replace(/_/g, '.');
        if (/Linux/i.test(ua)) return 'Linux';

          whatsappError.hidden = !show;
          whatsappInput.setAttribute('aria-invalid', show ? 'true' : 'false');
        }
        function keepWhatsappNumeric(value){
          var raw = String(value || '');
          // Accept harmless formatting that users commonly paste into phone
          // fields. Submit-time validation still enforces the selected
          // country's length and E.164 format.
          var invalid = /[^0-9+().\s-]/.test(raw);
          var digits = raw.replace(/\D/g, '');
          var countryDigits = String(phoneCountry && phoneCountry.value || '').replace(/\D/g, '');
          if (raw.trim().charAt(0) === '+' && countryDigits && digits.indexOf(countryDigits) === 0) {
            digits = digits.slice(countryDigits.length);

        });
        if (phoneCountry) phoneCountry.addEventListener('change', syncWhatsappField);
        syncWhatsappField();

      function conditionalDepth(field, fields){
        var depth = 1;
        var visited = {};
        var condition = field && field.showWhen;
        var parent = condition ? fields.find(function(candidate){ return (condition.fieldId && String(candidate.id) === String(condition.fieldId)) || (!condition.fieldId && condition.fieldKey && String(candidate.sourceKey) === String(condition.fieldKey)); }) : null;
        while (parent && !visited[String(parent.id)]) {
          visited[String(parent.id)] = true;
          depth += 1;
          var parentCondition = parent.showWhen;
          parent = parentCondition ? fields.find(function(candidate){ return (parentCondition.fieldId && String(candidate.id) === String(parentCondition.fieldId)) || (!parentCondition.fieldId && parentCondition.fieldKey && String(candidate.sourceKey) === String(parentCondition.fieldKey)); }) : null;
        }
        return depth;
      }

      function conditionalFieldHtml(field, index, fields){
        var html = fieldHtml(field);
        var condition = field && field.showWhen;
        if (!advanced || field.hidden || !condition || (!condition.fieldId && !condition.fieldKey)) return html;
        var level = conditionalDepth(field, fields);
        var indent = Math.min(Math.max(level - 1, 0), 4) * 12;
        return html.replace('<div class="field ', '<div class="field full conditional-field" style="margin-left:' + indent + 'px" data-conditional-level="' + level + '" data-show-when-field-id="' + esc(condition.fieldId || '') + '" data-show-when-field-key="' + esc(condition.fieldKey || '') + '" data-show-when-value="' + esc(condition.value || '') + '" ');
      }

      function orderGenericConditionalFields(fields){
        if (!advanced) return fields;
        var ordered = [];
        var visited = {};
        function parentFor(field){
          var condition = field && field.showWhen;
          if (!condition) return null;
          return fields.find(function(candidate){ return (
            (condition.fieldId && String(candidate.id) === String(condition.fieldId)) ||
            (condition.fieldKey && String(candidate.sourceKey) === String(condition.fieldKey)) ||
            (condition.parentQuestion && String(candidate.label || '') === String(condition.parentQuestion))
          ); }) || null;
        }
        var conditionalRoots = fields.filter(function(field){
          return field && (
            field.conditionalFlow === true ||
            String(field.sourceKey || '').indexOf('conditional-root_') === 0
          );
        });
        if (!conditionalRoots.length && fields.some(function(field){ return field && field.showWhen; })) {
          conditionalRoots = fields.filter(function(field){
            return field && field.sourceKind === 'custom' && !field.showWhen &&
              (field.fieldType === 'dropdown' || field.fieldType === 'radio' || field.fieldType === 'multiselect');
          }).slice(0, 1);
        }
        var fallbackRootId = conditionalRoots.length === 1 ? String(conditionalRoots[0].id) : '';
        function append(field){
          var fieldId = String(field && field.id || '');
          if (!field || visited[fieldId]) return;
          visited[fieldId] = true;
          ordered.push(field);
          var children = fields.filter(function(child){
            var parent = parentFor(child);
            return parent && String(parent.id) === fieldId;
          });
          if (!children.length && fallbackRootId === fieldId) {
            children = fields.filter(function(child){ return child && child.showWhen; });
          }
          children.forEach(append);
        }
        fields.forEach(function(field){ if (!parentFor(field)) append(field); });
        fields.forEach(append);
        return ordered;
      }

      function setupGenericConditionalFields(fields){
        if (!advanced) return;
        var form = root.querySelector('#gbs-form');
        if (!form) return;
        var conditionalWrappers = root.querySelectorAll('[data-show-when-field-id], [data-show-when-field-key]');
        function readFieldValues(sourceKey){
          var values = [];
          Array.prototype.forEach.call(form.elements, function(control){
            if (!control || control.name !== sourceKey) return;
            if (control.disabled) return;
            if ((control.type === 'checkbox' || control.type === 'radio') && !control.checked) return;
            if (control.tagName === 'SELECT' && control.multiple) {
              Array.prototype.forEach.call(control.selectedOptions, function(option){ values.push(String(option.value)); });
            } else if (control.value != null) {
              values.push(String(control.value));
            }
          });
          return values;
        }
        function clearFieldValues(wrapper){
          Array.prototype.forEach.call(wrapper.querySelectorAll('input,select,textarea'), function(control){
            if (control.type === 'checkbox' || control.type === 'radio') {
              control.checked = false;
            } else if (control.tagName === 'SELECT') {
              control.selectedIndex = -1;
            } else {
              control.value = '';
            }
          });
        }
        function updateVisibility(){
          var changed = true;
          var pass = 0;
          while (changed && pass <= fields.length) {
            changed = false;
            pass += 1;
            Array.prototype.forEach.call(conditionalWrappers, function(wrapper){
              var fieldId = wrapper.getAttribute('data-show-when-field-id') || '';
              var fieldKey = wrapper.getAttribute('data-show-when-field-key') || '';
              var conditionField = fields.find(function(field){ return (fieldId && String(field.id) === fieldId) || (!fieldId && fieldKey && String(field.sourceKey) === fieldKey); });
              var values = conditionField ? readFieldValues(conditionField.sourceKey) : [];
              var expected = wrapper.getAttribute('data-show-when-value') || '';
              var visible = Boolean(conditionField && expected && values.indexOf(expected) !== -1);
              var wasVisible = !wrapper.hidden;
              if (!visible && wasVisible) clearFieldValues(wrapper);
              if (wasVisible !== visible) changed = true;
              wrapper.hidden = !visible;
              wrapper.setAttribute('aria-hidden', visible ? 'false' : 'true');
              Array.prototype.forEach.call(wrapper.querySelectorAll('input,select,textarea'), function(control){ control.disabled = !visible; });
            });
          }
          scheduleSize();
          updateGenericSubmitState(fields);
        }
        form.addEventListener('change', updateVisibility);
        form.addEventListener('input', updateVisibility);
        updateVisibility();
      }

      function setupGenericFieldTypeValidation(fields){
        if (scope !== 'generic') return;
        (fields || []).forEach(function(field){
          if (!field || field.hidden || field.sourceKey === 'phone') return;
          var node = root.querySelector('[name="' + String(field.sourceKey || field.id).replace(/"/g, '\\"') + '"]');

          node.setAttribute('min', '0');
          node.setAttribute('step', 'any');
          node.setAttribute('inputmode', 'numeric');
          node.addEventListener('input', function(){
            var raw = String(node.value || '');
            var cleaned = raw.replace(/[^0-9.]/g, '');
            var dotIndex = cleaned.indexOf('.');
            if (dotIndex !== -1) cleaned = cleaned.slice(0, dotIndex + 1) + cleaned.slice(dotIndex + 1).replace(/\./g, '');
            if (node.value !== cleaned) node.value = cleaned;
          });
        });
      }

      function multiStepConfig(){

        var steps = Array.isArray(settings.steps) && settings.steps.length ? settings.steps : [{ id:'step-1', title:'Step 1', description:'' }];

      function isConditionalFieldVisible(field, fields){
        var condition = field && field.showWhen;
        if (!advanced || !condition || (!condition.fieldId && !condition.fieldKey)) return true;
        var parent = fields.find(function(candidate){ return (condition.fieldId && String(candidate.id) === String(condition.fieldId)) || (!condition.fieldId && condition.fieldKey && String(candidate.sourceKey) === String(condition.fieldKey)); });
        if (!parent) return true;
        var node = document.querySelector('[name="' + String(parent.sourceKey || parent.id).replace(/"/g, '\\"') + '"]');
        if (!node) return false;
        var values = [];
        if (node.type === 'checkbox' || node.type === 'radio') document.querySelectorAll('[name="' + String(parent.sourceKey || parent.id).replace(/"/g, '\\"') + '"]:checked').forEach(function(control){ values.push(String(control.value)); });
        else values.push(String(node.value || ''));
        return values.indexOf(String(condition.value || '')) !== -1;
      }

      function validateStep(stepIndex){
        var config = multiStepConfig();
        if (!config.enabled) return true;
        var stepId = String(config.steps[stepIndex].id);
        var fields = Array.isArray(formData.fields) ? formData.fields : [];
        fields = orderGenericConditionalFields(fields);
        var errors = {};
        fields.forEach(function(field){
          if (String(field.stepId || config.steps[0].id) !== stepId || !field.required || field.hidden || !isConditionalFieldVisible(field, fields)) return;
          var node = document.querySelector('[name="' + String(field.sourceKey || field.id).replace(/"/g, '\\"') + '"]');
          if (!node) return;
          var value = node.type === 'checkbox' ? (node.checked ? 'true' : '') : node.value;
          if (!String(value || '').trim()) errors[field.sourceKey || field.id] = 'This field is required.';
        });
        showFieldErrors(errors);
        return Object.keys(errors).length === 0;

      function updateGenericSubmitState(fields){

        if (!advanced || busy) return;

        var button = document.getElementById('submit-btn');

        var form = root.querySelector('#gbs-form');

        if (!button || !form) return;

        var complete = (fields || []).every(function(field){
          if (!field || !field.required || field.hidden) return true;

          var fieldName = String(field.sourceKey || field.id || '');

          var controls = Array.prototype.filter.call(form.elements, function(control){ return control && control.name === fieldName; });

          if (!controls.length) return false;

          var visibleControls = controls.filter(function(control){
            var wrapper = control.closest('.field');
            return !control.disabled && (!wrapper || !wrapper.hidden);
          });

          if (!visibleControls.length) return true;

          if (visibleControls.some(function(control){ return control.type === 'checkbox' || control.type === 'radio'; })) {
            return visibleControls.some(function(control){ return control.checked; });
          }

          if (visibleControls.some(function(control){ return control.type === 'file'; })) {
            return visibleControls.some(function(control){ return control.files && control.files.length > 0; });
          }

          if (visibleControls.some(function(control){ return control.tagName === 'SELECT' && control.multiple; })) {
            return visibleControls.some(function(control){ return Array.prototype.some.call(control.selectedOptions || [], function(option){ return String(option.value || '').trim() !== ''; }); });
          }

          return visibleControls.some(function(control){ return String(control.value || '').trim() !== ''; });
        });

        button.disabled = !complete;

      }

      function showStep(stepIndex){
        var config = multiStepConfig();
        if (!config.enabled) return;
        currentStepIndex = Math.max(0, Math.min(stepIndex, config.steps.length - 1));
        var stepId = String(config.steps[currentStepIndex].id);
        (formData.fields || []).forEach(function(field){
          var node = document.querySelector('[name="' + String(field.sourceKey || field.id).replace(/"/g, '\\"') + '"]');
          var shell = node && node.closest('.field');
          if (shell) shell.style.display = String(field.stepId || config.steps[0].id) === stepId ? '' : 'none';
        });
        document.querySelectorAll('.step-progress-item').forEach(function(node, index){ node.classList.toggle('current', index === currentStepIndex); node.classList.toggle('completed', index < currentStepIndex); });
        var description = document.getElementById('step-description');
        if (description) description.textContent = config.steps[currentStepIndex].description || '';
        var previous = document.getElementById('step-previous');
        var next = document.getElementById('step-next');
        var submit = document.getElementById('submit-btn');
        var recaptcha = document.getElementById('recaptcha-container');
        if (previous) previous.style.display = currentStepIndex > 0 ? '' : 'none';
        if (next) next.style.display = currentStepIndex < config.steps.length - 1 ? '' : 'none';
        if (submit) submit.style.display = currentStepIndex === config.steps.length - 1 ? '' : 'none';
        if (recaptcha) recaptcha.style.display = currentStepIndex === config.steps.length - 1 ? '' : 'none';
      }

      function renderForm(data){

        formData = data || {};

        document.documentElement.classList.toggle('generic-scope', scope === 'generic');
        document.documentElement.classList.toggle('travel-scope', scope === 'travel');
        document.documentElement.classList.toggle('generic-preview-desktop', isBuilderPreview && advanced && previewDevice === 'desktop');
        document.documentElement.classList.toggle('generic-preview-tablet', isBuilderPreview && advanced && previewDevice === 'tablet');
        document.documentElement.classList.toggle('generic-preview-mobile', isBuilderPreview && advanced && previewDevice === 'mobile');

        var style = formData.style || {};

        document.body.style.background = /^(#[0-9a-f]{6})$/i.test(String(style.backgroundColor || '')) ? style.backgroundColor : '#EBEFF3';

        document.documentElement.style.cssText = styleVars(style);

        var fields = Array.isArray(formData.fields) ? formData.fields : [];
        fields = orderGenericConditionalFields(fields);

        var titleOverride = new URLSearchParams(window.location.search).get('title');
        var rawTitle = String(titleOverride || (formData.settings && formData.settings.formTitle) || '').trim();
        var title = esc(rawTitle);
        var titleHtml = title ? '<h1>' + title + '</h1>' : '';

        var desc = esc(formData.description || '');

        var button = esc((formData.settings && formData.settings.submitButtonLabel) || 'Submit');

        var logo = style.logoUrl ? '<img class="logo" src="' + esc(style.logoUrl) + '" alt="Logo" />' : '';

        var optIn = '';

        if (formData.settings && formData.settings.optInEnabled) {
          var rawConsent = formData.settings.optInText || 'I agree to receive communication on newsletters, promotional content, offers and events.';
          var markdownLink = rawConsent.match(/\[([^\]]+)\]\(([^)]+)\)\s*$/);
          var linkText = formData.settings.optInLinkText || (markdownLink ? markdownLink[1] : '');
          var linkUrl = formData.settings.optInLinkUrl || (markdownLink ? markdownLink[2] : '');
          var baseConsent = markdownLink ? rawConsent.replace(/\s*\[[^\]]+\]\([^)]+\)\s*$/, '') : rawConsent;
          var consentText = esc(baseConsent);
          var linkHtml = linkText && linkUrl ? ' <a href="' + esc(linkUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(linkText) + '</a>' : '';
          optIn = '<div class="field full optin"><label class="check"><input type="checkbox" name="optInConsent" value="true" /><span>' + consentText + linkHtml + '</span></label></div>';
        }

        var recaptcha = advanced && formData.settings && formData.settings.recaptchaEnabled && formData.settings.recaptchaSiteKey ? '<div id="recaptcha-container" class="field"><div class="g-recaptcha" data-sitekey="' + esc(formData.settings.recaptchaSiteKey) + '"></div></div>' : '';
        var footerLink = formData.settings && formData.settings.showPoweredBy === false
          ? ''
          : '<a href="/" target="_top" rel="noopener noreferrer" aria-label="Go to GlobusCRM home page">Powered By GlobusCRM</a>';

        var stepConfig = multiStepConfig();
        var progress = stepConfig.enabled ? '<div class="step-progress" aria-label="Form progress">' + stepConfig.steps.map(function(step, index){ return '<div class="step-progress-item" data-step="' + index + '"><span class="step-number">' + (index + 1) + '</span>' + esc(step.title || ('Step ' + (index + 1))) + '</div>'; }).join('') + '</div><div id="step-description" class="step-description"></div>' : '';
        var stepActions = stepConfig.enabled ? '<button type="button" class="primary" id="step-previous">Previous</button><button type="button" class="primary" id="step-next">Next</button>' : '';
        root.innerHTML = '<div class="panel">' + logo + '<div class="form-header">' + titleHtml + (desc ? '<p class="desc">' + desc + '</p>' : '') + '</div>' + progress + '<div id="msg"></div><form id="gbs-form"><div class="grid">' + fields.map(function(field, index){ return conditionalFieldHtml(field, index, fields); }).join('') + '</div>' + optIn + recaptcha + '<div class="actions">' + stepActions + '<button class="primary" id="submit-btn" type="submit">' + button + '</button></div></form>' + (footerLink ? '<div class="note powered-by">' + footerLink + '</div>' : '') + '</div>';
        setupGenericWhatsapp();
        setupGenericConditionalFields(fields);
        setupGenericPhone();
        setupGenericFieldTypeValidation(fields);
        if (recaptcha) { var script = document.createElement('script'); script.src = 'https://www.google.com/recaptcha/api.js'; script.async = true; script.defer = true; document.head.appendChild(script); }

        if (advanced) {
          var pickerPhoneSettings = formData.settings || {};
          var pickerAllowedCountries = (pickerPhoneSettings.phoneAllowedCountries || []).map(function(value){ return '+' + String(value).replace(/\D/g, ''); }).filter(function(value){ return value !== '+'; });
          var pickerRestrictedCountries = (pickerPhoneSettings.phoneAllowAllCountries === false || String(pickerPhoneSettings.phoneAllowAllCountries).toLowerCase() === 'false') && pickerAllowedCountries.length > 0;
          var countrySelect = root.querySelector('select[name="phoneCountry"]');
          var genericPhoneInput = root.querySelector('input[name="phone"]');
          function nationalPhoneMaxLength() {
            var countryDigits = String(countrySelect && countrySelect.value || '').replace(/\D/g, '');
            return Math.max(1, 15 - countryDigits.length);
          }
          if (countrySelect) {
            if (pickerRestrictedCountries && pickerAllowedCountries.length && pickerAllowedCountries.indexOf(countrySelect.value) === -1) countrySelect.value = pickerAllowedCountries[0];
            var picker = document.createElement('div');
            picker.className = 'phone-country-picker';
            var trigger = document.createElement('input');
            trigger.type = 'text';
            function updatePickerTrigger(){
              var selectedOption = countrySelect.options[countrySelect.selectedIndex];
              if (selectedOption) {
                trigger.value = String(selectedOption.value);
                preloadPhoneCountryFlag(selectedOption.value);
                var flagUrl = phoneCountryFlagUrl(selectedOption.value);
                trigger.style.backgroundImage = flagUrl ? 'url("' + flagUrl + '")' : 'none';
              }
            }
            updatePickerTrigger();
            trigger.placeholder = '+91';
            trigger.inputMode = 'numeric';
            // The displayed country code includes the international '+'
            // prefix (for example, +91), so the picker must allow it.
            trigger.pattern = '\\+?[0-9]*';
            trigger.setAttribute('aria-label', 'Phone country code');
            var options = document.createElement('div');
            options.className = 'phone-country-options';
            options.style.zIndex = '50';
            Array.prototype.forEach.call(countrySelect.options, function(option) {
              var item = document.createElement('button');
              item.type = 'button';
              var flag = document.createElement('img');
              flag.className = 'phone-country-flag';
              flag.alt = '';
              flag.setAttribute('aria-hidden', 'true');
              flag.loading = 'lazy';
              flag.src = phoneCountryFlagUrl(option.value);
              var code = document.createElement('span');
              code.textContent = String(option.value);
              item.appendChild(flag);
              item.appendChild(code);
              item.className = option.value === countrySelect.value ? 'selected' : '';
              item.addEventListener('click', function() {
                countrySelect.value = option.value;
                countrySelect.dispatchEvent(new Event('change'));
                updatePickerTrigger();
                picker.classList.remove('open');
                options.style.display = 'none';
                options.querySelectorAll('button').forEach(function(node) { node.classList.remove('selected'); });
                item.classList.add('selected');
              });
              item.addEventListener('pointerenter', function(){ preloadPhoneCountryFlag(option.value); });
              item.dataset.code = option.value;
              item.style.display = !pickerRestrictedCountries || pickerAllowedCountries.indexOf(option.value) !== -1 ? 'block' : 'none';
              options.appendChild(item);
            });
            function openCountryPicker(){
              picker.classList.add('open');
              options.style.display = 'block';
            }
            function closeCountryPicker(){
              picker.classList.remove('open');
              options.style.display = 'none';
            }
            document.addEventListener('pointerdown', function(event) {
              if (!picker.contains(event.target)) closeCountryPicker();
            });
            trigger.addEventListener('focus', function(event) { openCountryPicker(); trigger.select(); if (event) event.stopPropagation(); });
            trigger.addEventListener('pointerdown', function(event) { openCountryPicker(); if (event) event.stopPropagation(); });
            trigger.addEventListener('click', openCountryPicker);
            trigger.addEventListener('keydown', openCountryPicker);
            trigger.addEventListener('input', function() {
              var numericQuery = trigger.value.replace(/\D/g, '');
              if (trigger.value !== numericQuery) trigger.value = numericQuery;
              var query = numericQuery ? '+' + numericQuery : '';
              var normalizedQuery = numericQuery;
              openCountryPicker();
              options.querySelectorAll('button').forEach(function(node) {
                var searchable = String(node.textContent || '').toLowerCase() + ' ' + String(node.dataset.code || '').toLowerCase();
                var normalizedSearchable = searchable.replace(/\+/g, '');
                var allowed = !pickerRestrictedCountries || pickerAllowedCountries.indexOf(node.dataset.code) !== -1;
                node.style.display = allowed && (!normalizedQuery || normalizedSearchable.indexOf(normalizedQuery) !== -1) ? 'block' : 'none';
              });
              var exact = Array.prototype.find.call(countrySelect.options, function(option) { return option.value.toLowerCase() === query || option.value.replace(/^\+/, '') === numericQuery; });
              if (exact) { countrySelect.value = exact.value; countrySelect.dispatchEvent(new Event('change')); }
            });
            countrySelect.addEventListener('change', updatePickerTrigger);
            picker.appendChild(trigger);
            picker.appendChild(options);
            countrySelect.style.display = 'none';
            countrySelect.parentNode.insertBefore(picker, countrySelect);
          }

        if (genericPhoneInput) {
            // E.164 permits at most 15 digits; one extra character allows a
            // pasted leading "+" before it is normalized to national digits.
            genericPhoneInput.setAttribute('maxlength', '16');
            genericPhoneInput.setAttribute('inputmode', 'numeric');
            genericPhoneInput.addEventListener('input', function() {
              var rawPhoneInput = String(genericPhoneInput.value || '');
              var digits = rawPhoneInput.replace(/\D/g, '');
              var selectedCountryDigits = String(countrySelect && countrySelect.value || '').replace(/\D/g, '');
              if (rawPhoneInput.trim().charAt(0) === '+' && selectedCountryDigits && digits.indexOf(selectedCountryDigits) === 0) {
                digits = digits.slice(selectedCountryDigits.length);
              }
              digits = digits.slice(0, nationalPhoneMaxLength());
              if (genericPhoneInput.value !== digits) genericPhoneInput.value = digits;
            });
        }

        }

        scheduleSize();

        var formEl = document.getElementById('gbs-form');

        if (multiStepConfig().enabled) {
          document.getElementById('step-next').addEventListener('click', function(){ if (validateStep(currentStepIndex)) showStep(currentStepIndex + 1); });
          document.getElementById('step-previous').addEventListener('click', function(){ showStep(currentStepIndex - 1); });
          showStep(0);
        }

        formEl.addEventListener('submit', submitForm);

      }



      function showBusy(flag){

        busy = flag;

        var btn = document.getElementById('submit-btn');

        if (!btn) return;

        btn.disabled = flag;

        btn.innerHTML = flag ? '<span class="spinner"></span>' + esc((formData.style && formData.style.buttonLoadingText) || 'Submitting...') : esc((formData.settings && formData.settings.submitButtonLabel) || 'Submit');
        if (advanced && formData.style && flag && /^(#[0-9a-f]{6})$/i.test(String(formData.style.buttonLoadingColor || ''))) btn.style.background = formData.style.buttonLoadingColor;
        else btn.style.background = '';

        if (!flag && advanced) updateGenericSubmitState(formData.fields || []);

      }

      function showFieldErrors(errors){
        document.querySelectorAll('.field-error').forEach(function(el){ el.remove(); });
        Object.keys(errors || {}).forEach(function(key){
          var nodes = document.querySelectorAll('[name="' + String(key).replace(/"/g, '\\"') + '"]');
          if (!nodes.length) return;
          var field = nodes[0].closest('.field');
          if (!field) return;
          var message = document.createElement('span');
          message.className = 'field-error';
          message.textContent = String(errors[key] || 'Invalid value');
          field.appendChild(message);
        });
      }



      async function submitForm(event){

        event.preventDefault();

        if (busy) return;

        var stepConfig = multiStepConfig();
        if (stepConfig.enabled) {
          for (var stepIndex = 0; stepIndex < stepConfig.steps.length; stepIndex += 1) {
            if (!validateStep(stepIndex)) { showStep(stepIndex); return; }
          }
        }
        if (advanced && formData.settings && formData.settings.recaptchaEnabled) {
          var captchaToken = window.grecaptcha && window.grecaptcha.getResponse ? window.grecaptcha.getResponse() : '';
          if (!captchaToken) { showInlineError('Please complete the "I\'m not a robot" verification.'); return; }
        }

        showBusy(true);

          var fd = new FormData(event.target);
          if (advanced && formData.settings && formData.settings.recaptchaEnabled && window.grecaptcha) fd.set('recaptchaToken', window.grecaptcha.getResponse());

        // Generic CRM attribution metadata. These values are informational
        // only; the server remains the source of truth for tenant/form IDs.
        if (scope === 'generic') {
          var pageUrl = hostContext.pageUrl || document.referrer || window.location.href;
          var pageTitle = hostContext.pageTitle || document.title || formData.name || '';
          var pageUrlObject = null;
          try { pageUrlObject = new URL(pageUrl); } catch(e) {}
          var query = pageUrlObject ? pageUrlObject.searchParams : new URLSearchParams(window.location.search);
          var pageSource = query.get('utm_source') || (document.referrer ? (function(){ try { return new URL(document.referrer).hostname; } catch(e) { return ''; } })() : 'direct');
          ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','fbclid','fbc','fbp'].forEach(function(key){ rememberCookie('gbs_' + key, query.get(key) || ''); });
          rememberCookie('gbs_landing_url', pageUrl);
          rememberCookie('gbs_landing_title', pageTitle);
          var tracking = {
            pageUrl: pageUrl,
            pageTitle: pageTitle,
            pageSource: pageSource,
            referrerUrl: document.referrer || '',
            landingPageUrl: readCookie('gbs_landing_url') || pageUrl,
            currentDomain: pageUrlObject ? pageUrlObject.hostname : window.location.hostname,
            formName: formData.name || '',
            formId: formData.id || slug,
            utm_source: readCookie('gbs_utm_source'),
            utm_medium: readCookie('gbs_utm_medium'),
            utm_campaign: readCookie('gbs_utm_campaign'),
            utm_term: readCookie('gbs_utm_term'),
            utm_content: readCookie('gbs_utm_content'),
            gclid: readCookie('gbs_gclid'),
            fbclid: readCookie('gbs_fbclid'),
            fbc: readCookie('gbs_fbc'),
            fbp: readCookie('gbs_fbp'),
            submittedAt: new Date().toISOString(),
            browser: normalizeBrowser(navigator.userAgent),
            operatingSystem: normalizeOs(navigator.userAgent),
            deviceType: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'mobile' : 'desktop'
          };
          // Internal transport header: this is not a form field and is never
          // exposed in the form builder or rendered in the visitor form.
          event._gbsTrackingMetadata = tracking;
        }

        if (advanced && fd.get('phone') && fd.get('phoneCountry')) {
            var phoneInput = String(fd.get('phone')).trim();
            var nationalDigits = phoneInput.replace(/\D/g, '');
            var countryCode = String(fd.get('phoneCountry') || '+91').trim();
            var countryDigits = countryCode.replace(/\D/g, '');
            // A browser/autofill may provide the complete +91... value even
            // though the country code is selected separately. Do not count
            // the prefix as part of the national number or add it twice.
            if (phoneInput.charAt(0) === '+' && countryDigits && nationalDigits.indexOf(countryDigits) === 0) {
              nationalDigits = nationalDigits.slice(countryDigits.length);
            }
            var phoneRule = phoneRules[countryCode] || [7, 15];
            if (nationalDigits.length < phoneRule[0] || nationalDigits.length > phoneRule[phoneRule.length - 1]) {
              showBusy(false);
              showFieldErrors({ phone: 'Enter a valid phone number with ' + (phoneRule[0] === phoneRule[phoneRule.length - 1] ? phoneRule[0] : phoneRule[0] + '-' + phoneRule[phoneRule.length - 1]) + ' digits.' });
              return;
            }
            var internationalPhone = countryCode + nationalDigits;
            if (!/^\+[1-9]\d{7,14}$/.test(internationalPhone)) {
              showBusy(false);
              showFieldErrors({ phone: 'Enter a valid international phone number.' });
              return;
            }
            // Keep the country code separate in the multipart payload. The
            // API owns canonical E.164 assembly; sending +91... here made
            // older backend workers count the country prefix twice.
            fd.set('phone', nationalDigits);
          }

          if (fd.get('whatsappPhone') && fd.get('phoneCountry')) {
            var whatsappInput = String(fd.get('whatsappPhone')).trim();
            var whatsappDigits = whatsappInput.replace(/\D/g, '');
            var whatsappRule = phoneRules[String(fd.get('phoneCountry')).trim()] || [7, 15];
            if (whatsappDigits.length < whatsappRule[0] || whatsappDigits.length > whatsappRule[whatsappRule.length - 1]) {
              showBusy(false);
              showFieldErrors({ whatsappPhone: 'Enter a valid WhatsApp number with ' + (whatsappRule[0] === whatsappRule[whatsappRule.length - 1] ? whatsappRule[0] : whatsappRule[0] + '-' + whatsappRule[whatsappRule.length - 1]) + ' digits.' });
              return;
            }
            var internationalWhatsapp = String(fd.get('phoneCountry')).trim() + whatsappDigits;
            if (!/^\+[1-9]\d{7,14}$/.test(internationalWhatsapp)) {
              showBusy(false);
              showFieldErrors({ whatsappPhone: 'Enter a valid international WhatsApp number.' });
              return;
            }
            fd.set('whatsappPhone', whatsappDigits);
          }

        try {

          var requestHeaders = {};
          if (event._gbsTrackingMetadata) {
            requestHeaders['X-GBS-Tracking'] = JSON.stringify(event._gbsTrackingMetadata);
          }
          var res = await fetch(apiBase + '/api/forms/public/' + encodeURIComponent(slug) + '/submit?scope=' + encodeURIComponent(scope), { method: 'POST', body: fd, headers: requestHeaders });

          var json = await res.json().catch(function(){ return {}; });

          if (!res.ok) {
            var submitError = new Error(json.error || 'Submit failed');
            submitError.fieldErrors = json.fields || {};
            throw submitError;
          }

          if (json.redirectUrl || (formData.settings && formData.settings.afterSubmitAction === 'redirect' && formData.settings.redirectUrl)) {

            window.location.href = json.redirectUrl || formData.settings.redirectUrl;

            return;

          }

          setMessage('success', (json.message || (formData.settings && formData.settings.successMessage) || 'Thank you.'));

          if (json.message) scheduleSize();

        } catch (err) {

          if (advanced && formData.settings && formData.settings.recaptchaEnabled && window.grecaptcha && window.grecaptcha.reset) window.grecaptcha.reset();

          showFieldErrors(err.fieldErrors || {});
          var msg = document.getElementById('msg');
          if (msg) msg.innerHTML = Object.keys(err.fieldErrors || {}).length ? '' : '<div class="error">' + esc(err.message || 'Something went wrong') + '</div>';

          scheduleSize();

        } finally {

          showBusy(false);

        }

      }



      async function load(){

        var previewData = '';

        if (location.hash && location.hash.indexOf('preview=') === 1) {

          previewData = decodeURIComponent(location.hash.substring(9));

        }

        if (previewData) {

          try {
            var previewForm = JSON.parse(previewData);
            if (advanced && previewForm.settings && previewForm.settings.recaptchaEnabled && !previewForm.settings.recaptchaSiteKey) {
              var previewRef = previewForm.id || previewForm.slug || slug;
              var previewRes = await fetch(apiBase + '/api/forms/public/' + encodeURIComponent(previewRef) + '?scope=' + encodeURIComponent(scope));
              if (previewRes.ok) {
                var publicPreview = await previewRes.json();
                previewForm.settings = Object.assign({}, previewForm.settings, { recaptchaSiteKey: publicPreview.settings && publicPreview.settings.recaptchaSiteKey });
              }
            }
            renderForm(previewForm);

            return;

          } catch (err) {

            setMessage('error', err.message || 'Invalid preview data');

            return;

          }

        }

        if (!slug) {

          setMessage('error', 'Missing form reference.');

          return;

        }

        try {

          var res = await fetch(apiBase + '/api/forms/public/' + encodeURIComponent(slug) + '?scope=' + encodeURIComponent(scope));

          var json = await res.json();

          if (!res.ok) throw new Error(json.error || 'Form not found');

          renderForm(json);

        } catch (err) {

          setMessage('error', err.message || 'Unable to load form');

        }

      }



      load();

    })();

  </script>
