server {
    listen 8080;
    server_name gateway;

    # Migrated Phase 0 routes — proxy to Go backend
    location /api/health {
        proxy_pass http://backend-go:5000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/audit {
        proxy_pass http://backend-go:5000/api/audit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other API traffic — proxy to Node.js backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads and other backend paths
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /p/ {
        proxy_pass http://backend:3000/p/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /trips {
        proxy_pass http://backend:3000/trips;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
